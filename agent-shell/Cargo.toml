[package]
name = "lumimi"
version = "0.1.1"
description = "Lumimi — satu exe satu proses: shell Tauri (WebView2) + server Rust in-process"
edition = "2021"
rust-version = "1.77"

# Nama binary = Lumimi.exe (huruf kapital, sesuai produk).
[[bin]]
name = "Lumimi"
path = "src/main.rs"

# Binary statis kecil; WebView2 diambil dari runtime bawaan Windows.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SATU PROSES: shell me-link server Rust dan menjalankannya in-process
# (thread runtime tokio sendiri) — tak ada exe server kedua, tak ada sidecar.
live2d-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "macros", "io-util", "sync"] }
# Dialog folder NATIVE Windows untuk import model (command import_model_dialog)
# — menyalin folder langsung di disk, tanpa upload base64 lewat WebView.
rfd = "0.15"

[features]
default = []
# STT native in-process (butuh cmake + LLVM/libclang saat build):
#   cargo build --release -p lumimi --features engine-stt
engine-stt = ["live2d-core/engine-stt"]

# Profil release dipindah ke workspace root (Cargo mengabaikan profil member
# di dalam workspace). Ukuran exe shell tetap dijaga kecil di root.
