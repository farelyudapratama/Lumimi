<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Lumimi Desktop Pet</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon.ico" sizes="any" />
<style>
  /* Overlay desktop di jendela Chrome --app: body transparan, semua kontrol
     mengambang. Palet & anggaran render sama dengan app utama (static/css/app.css):
     warna solid, tanpa blur/gradient, bayangan hanya di elemen mengambang. */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
  #stage { position: fixed; inset: 0; background: transparent; }
  #live2d-canvas { position: absolute; top: 0; left: 0; }
  #pet-ui {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 3px;
    border-radius: 6px; background: #12151C; border: 1px solid #232936;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.42);
    opacity: 0.28; transition: opacity 0.18s ease;
  }
  #pet-ui:hover { opacity: 1; }
  .btn {
    border: 1px solid transparent; background: none; color: #9BA5B4;
    border-radius: 4px; padding: 5px 11px; cursor: pointer;
    font: 12px "Segoe UI", -apple-system, system-ui, sans-serif;
    transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }
  .btn:hover { background: #212734; border-color: #333B4B; color: #EDF0F4; }
  /* Tutup = merah hanya saat disentuh, supaya tidak menarik perhatian terus. */
  #b-close:hover { background: #2A1618; border-color: #5C2A2A; color: #DE4A45; }
  /* Klik-tembus aktif: hijau mint, penanda bahwa klik menembus desktop. */
  #b-through.active { background: #12231A; border-color: #235437; color: #21A557; }
  #bubble {
    position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
    max-width: 320px; background: #12151C; color: #EDF0F4;
    border: 1px solid #333B4B; border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.48);
    padding: 9px 14px; display: none;
    font: 13px/1.55 "Segoe UI", -apple-system, system-ui, sans-serif;
  }
  #status {
    position: fixed; top: 6px; left: 8px;
    font: 10px ui-monospace, Consolas, monospace; color: #66707F;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="live2d-canvas"></canvas></div>
<div id="status">pet</div>
<div id="bubble"><span id="bubble-text"></span></div>
<div id="pet-ui" data-tauri-drag-region>
  <button class="btn" id="b-wave" data-i18n="petWindow.greet">Sapa</button>
  <button class="btn" id="b-talk" data-i18n="petWindow.talk">Bicara</button>
  <button class="btn" id="b-through" hidden data-i18n="petWindow.ctOff">Klik tembus</button>
  <button class="btn" id="b-close" data-i18n="petWindow.close">Tutup</button>
</div>
<script src="js/live2dcubismcore.min.js"></script>
<!-- Core i18n (khusus pet — app utama memuatnya di dalam bundle.js). Self-exec:
     menyweep atribut data-i18n* di atas sekaligus membaca localStorage, jadi
     bahasa pet mengikuti bahasa app utama (origin sama). -->
<script src="js/i18n.js?v=1"></script>
<!-- Stack render baru (Pixi 8 + Cubism 5-r.5 via adapter src/live2d) — sama
     dengan index.html: importmap pixi.js → pixi8.mjs (instance ESM terpisah),
     modul view mengambil alih #live2d-canvas saat __live2dRendererRequested. -->
<script type="importmap">{"imports":{"pixi.js":"./js/pixi8.mjs"}}</script>
<script type="module" src="js/live2d-view.mjs"></script>
<script>
(function () {
  // Basis HTTP: dev/browser → origin halaman (same-origin); embedded
  // (Lumimi, origin tauri.localhost) → loopback proses-sendiri, port via
  // IPC `server_port` + handshake token `server_token` (verifikasi
  // /api/version → instance harus cocok; bila gagal → probe 8310..8399).
  // Tanpa handshake, port yang sama bisa diduduki server asing/instalasi
  // Lumimi lain dan pet menampilkan model milik instalasi itu. Halaman pet
  // tidak memuat bundle.js → logika ini mandiri di sini (cermin
  // transport/index.ts — rentang probe HARUS sinkron dengan pick_port shell).
  let API = location.origin;
  let __portReady = null;
  const PROBE_FIRST = 8310, PROBE_LAST = 8399, PROBE_TIMEOUT_MS = 700;
  function portIsOurs(p, token) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), PROBE_TIMEOUT_MS);
    return fetch("http://127.0.0.1:" + p + "/api/version", { signal: ctl.signal })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => {
        if (!d || typeof d !== "object" || !d.core_version) return false;
        return token == null || d.instance === token;
      })
      .catch(() => false)
      .finally(() => clearTimeout(to));
  }
  async function probeLoopback(token) {
    for (let p = PROBE_FIRST; p <= PROBE_LAST; p++) {
      if (await portIsOurs(p, token)) return p;
    }
    return null;
  }
  function refreshApiBase() {
    if (!__portReady) {
      __portReady = (async () => {
        try {
          const t = window.__TAURI__;
          const invoke = t?.core?.invoke ?? t?.invoke;
          if (typeof invoke === "function") {
            const p = await invoke("server_port");
            let token = null;
            try {
              const tk = await invoke("server_token");
              if (typeof tk === "string" && tk) token = tk;
            } catch (e) {}
            if (typeof p === "number" && p > 0 && (await portIsOurs(p, token))) {
              API = "http://127.0.0.1:" + p;
              return API;
            }
            // Port dari IPC tidak menjawab sebagai server kita (asing naik
            // belakangan?) — jangan pernah dipakai; cari milik kita.
            const found = await probeLoopback(token);
            if (found) API = "http://127.0.0.1:" + found;
          }
        } catch (e) {}
        return API;
      })();
    }
    return __portReady;
  }
  refreshApiBase();
  // URL absolut untuk aset model (loader butuh absolut bila origin embed).
  function absUrl(path) {
    if (/^https?:\/\//.test(path)) return path;
    return API + "/" + String(path).replace(/^\/+/, "");
  }
  // Model awal: ?model= (dev/browser) → command pet_model (embedded) → daftar.
  async function petModelArg() {
    const q = qs.get("model");
    if (q) return q;
    try {
      const t = window.__TAURI__;
      const invoke = t?.core?.invoke ?? t?.invoke;
      if (typeof invoke === "function") {
        const m = await invoke("pet_model");
        if (m) return m;
      }
    } catch (e) {}
    return null;
  }
  const t = (k, v) => (window.__i18n ? window.__i18n.t(k, v) : k);
  const qs = new URLSearchParams(location.search);
  const state = { model: null, bubbleTimer: null, idleTimer: null };
  // Minta modul view mengambil alih canvas + janji siapnya (modul dieksekusi
  // setelah parsing, jadi flag aman dipasang dari sini).
  window.__live2dRendererRequested = true;
  window.__live2dStageSize = () => ({ w: window.innerWidth, h: window.innerHeight });
  if (!window.__live2dViewWait) {
    window.__live2dViewWait = new Promise((res) => {
      window.__live2dViewReadyResolve = res;
    });
  }

  function bubble(text, ms) {
    const b = document.getElementById("bubble");
    document.getElementById("bubble-text").textContent = text;
    b.style.display = "block";
    clearTimeout(state.bubbleTimer);
    state.bubbleTimer = setTimeout(() => (b.style.display = "none"), ms || 3500);
  }

  async function boot() {
    await refreshApiBase();
    document.getElementById("status").textContent = t("petWindow.loadingModel");
    let path = await petModelArg();
    if (!path) {
      try {
        const r = await fetch(API + "/api/models");
        const d = await r.json();
        const first = (d.models || [])[0];
        if (first) {
          const rp = await fetch(API + "/api/model/path?name=" + encodeURIComponent(first));
          const dp = await rp.json();
          path = dp.path;
        }
      } catch (e) {}
    }
    if (!path) { document.getElementById("status").textContent = t("petWindow.noModel"); return; }
    await window.__live2dViewWait;
    // Muat model lewat adapter stack baru (moc native, tanpa pixi-live2d).
    // URL absolut loopback bila origin embed (relatif menurun dengan benar).
    state.model = await window.__live2dView.loadModel(absUrl(path));
    const m = state.model;
    // Skala pas jendela lalu pusatkan (bounds dibaca via facade — math sama
    // dengan versi lama, dikoreksi sudah membaca bounds pasca-scale).
    const nat = m.getBounds();
    const natW = nat.width / m.scale.x;
    const natH = nat.height / m.scale.y;
    const s = Math.min((window.innerWidth * 0.9) / natW, (window.innerHeight * 0.92) / natH);
    m.scale.set(s);
    m.x = (window.innerWidth - natW * s) / 2;
    m.y = (window.innerHeight - natH * s) / 2 - window.innerHeight * 0.03;
    document.getElementById("status").textContent = t("petWindow.active");
    startIdleLife();
  }

  // ── "hidup" sebagai pet: goyang pelan + tatapan ke kursor + sapa berkala ──
  function startIdleLife() {
    let tm = 0; // bukan `t` — nama itu menabrak penerjemah i18n di scope luar.
    setInterval(() => {
      const m = state.model;
      if (!m) return;
      tm += 0.016;
      m.rotation = Math.sin(tm * 0.9) * 0.012; // goyang halus seperti bernapas
    }, 16);
    window.addEventListener("mousemove", (e) => {
      // Gaze framework: semua sendi (kepala/mata/badan) ikut kursor,
      // ter-skala range aktual model — paritas dengan app utama.
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      window.__live2dView.setLookTarget(nx, -ny);
    });
    // sapa berkala kecil
    const lines = [
      t("petWindow.idle1"), t("petWindow.idle2"),
      t("petWindow.idle3"), t("petWindow.idle4"),
      t("petWindow.idle5"), t("petWindow.idle6"),
    ];
    state.idleTimer = setInterval(() => {
      if (Math.random() < 0.5) bubble(lines[Math.floor(Math.random() * lines.length)]);
    }, 90000);
  }

  function motionOrExpression(kind) {
    const m = state.model;
    if (!m) return;
    try {
      if (kind === "wave" && m.motion) m.motion("TapBody", Math.floor(Math.random() * 2));
    } catch (e) {}
  }

  document.getElementById("b-wave").addEventListener("click", () => {
    motionOrExpression("wave");
    bubble(t("petWindow.waveBack"));
  });
  document.getElementById("b-talk").addEventListener("click", () => {
    const lines = [t("petWindow.talk1"), t("petWindow.talk2"), t("petWindow.talk3")];
    bubble(lines[Math.floor(Math.random() * lines.length)]);
  });

  // ── Integrasi cangkang Tauri (window transparan + klik-tembus) ──────
  // window.__TAURI__ hanya ada di shell Tauri (withGlobalTauri); di Chrome
  // --app undefined, jadi semua fitur di bawah di-feature-detect dan halaman
  // yang sama tetap jalan di kedua cangkang.
  const inTauri = () => typeof window.__TAURI__ !== "undefined";
  const tauriWin = () => inTauri() ? window.__TAURI__.window.getCurrentWindow() : null;

  async function applyClickThrough(on) {
    const w = tauriWin();
    if (w) { try { await w.setIgnoreCursorEvents(on); } catch (e) {} }
    const b = document.getElementById("b-through");
    if (b) {
      b.classList.toggle("active", on);
      b.textContent = on ? t("petWindow.ctOn") : t("petWindow.ctOff");
    }
  }

  // Tombol di bar hanya untuk MEMATIKAN klik-tembus yang tertinggal — saat
  // menyala, klik pada jendela menembus ke desktop sehingga tombol tak
  // terjangkau; pemicu utamanya panel app utama lewat /api/pet/clickthrough.
  const bThrough = document.getElementById("b-through");
  if (bThrough) {
    bThrough.addEventListener("click", async () => {
      try {
        const r = await fetch(API + "/api/pet/clickthrough", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ on: !bThrough.classList.contains("active") }),
        });
        const d = await r.json();
        applyClickThrough(!!d.clickThrough);
      } catch (e) {}
    });
    if (!inTauri()) bThrough.hidden = true; // tak berarti di Chrome --app
  }

  // Poll state server: sumber kebenaran klik-tembus ada di server agar bisa
  // dimatikan dari panel app utama (jendela yang tembus klik tidak bisa
  // diklik, jadi tombol di dalamnya saja tidak cukup sebagai jalan keluar).
  setInterval(async () => {
    if (!inTauri()) return;
    try {
      const r = await fetch(API + "/api/pet/state");
      const st = await r.json();
      applyClickThrough(!!st.clickThrough);
    } catch (e) {}
  }, 1500);

  document.getElementById("b-close").addEventListener("click", async () => {
    try { await fetch(API + "/api/pet/close", { method: "POST" }); } catch (e) {}
    // Di Tauri, window.close() hanya menutup konten webview, bukan jendela
    // OS — tutup jendelanya secara eksplisit. Dua-duanya dipanggil karena
    // server juga ikut mematikan proses lewat /api/pet/close.
    const w = tauriWin();
    if (w) { try { await w.destroy(); } catch (e) {} }
    window.close();
  });

  // Jendela frameless tidak punya tombol X — Esc sebagai jalan keluar cepat.
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") document.getElementById("b-close").click();
  });

  boot().catch((e) => {
    // Fail-loud: error boot disimpan + di-console — jendela pet kosong tanpa
    // petunjuk adalah kegagalan senyap klasik (lihat STATUS entri 19/29).
    window.__petBootError = String(e && e.stack || e && e.message || e);
    console.error("[pet] boot gagal:", e);
    document.getElementById("status").textContent =
      t("sys.errGeneric", { msg: e.message });
  })();
})();
</script>
</body>
</html>
