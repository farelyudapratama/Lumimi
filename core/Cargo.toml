# live2d-core: Rust application core (Tauri) untuk Lumimi.
#
# Menyajikan backend HTTP IN-PROCESS (axum, loopback) di dalam Tauri, inilah
# SATU executable (Lumimi.exe): tidak ada proses Bun terpisah.
# Lihat docs/ARCHITECTURE-TAURI-RUST.md §2 (single-exe).
[package]
name = "live2d-core"
version = "0.1.1"
description = "Application core (Rust) untuk Lumimi: server HTTP in-process di Tauri"
edition = "2021"
rust-version = "1.77"

[lib]
name = "live2d_core"
path = "src/lib.rs"

# Binary server produksi — menggantikan live2d-agent.exe (Bun). Tujuan akhir:
# melepas runtime JS. cargo run -p live2d-core (atau exe rilis).
[[bin]]
name = "live2d-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "time"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
tokio-stream = "0.1"
# CORS permisif untuk adapter HTTP eksternal/bridge (loopback saja):
# frontend ter-embed (origin tauri.localhost) + CLI/OBS mengakses loopback
# lintas-origin sampai migrasi IPC per-domain selesai.
tower-http = { version = "0.6", features = ["cors"] }
# Twitch chat = IRC over WebSocket (wss). rustls agar konsisten dgn reqwest
# (tanpa OpenSSL). YouTube live chat pakai reqwest (poll) — sudah ada.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Parser URL (kebijakan browser agent) — sudah jadi dep transitif reqwest.
url = "2"
# Engine inferensi native sebagai LIBRARY — TTS SuperTonic dipanggil IN-PROCESS
# (tanpa sidecar/HTTP). STT (whisper) di belakang feature `engine-stt` karena
# butuh cmake+libclang; TTS (ort) tidak.
live2d-engine = { path = "../engine", default-features = false }

[features]
default = []
# Aktifkan untuk STT native in-process (butuh cmake + LLVM):
#   cargo build -p live2d-core --features engine-stt
engine-stt = ["live2d-engine/stt"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
