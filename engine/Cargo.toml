# live2d-engine: library inferensi native (STT + TTS) untuk Lumimi.
#
# Dipakai IN-PROCESS oleh Rust core (bukan sidecar/exe): TTS SuperTonic
# (4 ONNX via `ort`) + STT Whisper via `whisper-rs` (binding whisper.cpp).
# Bin sidecar HTTP lama (src/main.rs) SUDAH DIHAPUS (2026-09-23) — tak ada
# konsumen tersisa (dulu hanya dijalankan server Bun yang kini arsip).
[package]
name = "live2d-engine"
version = "0.1.1"
description = "Library inferensi native (SuperTonic TTS + Whisper STT) untuk Lumimi, dipakai in-process oleh Rust core"
edition = "2021"
rust-version = "1.77"

[lib]
name = "live2d_engine"
path = "src/lib.rs"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries"] }
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_distr = "0.4"
unicode-normalization = "0.1"
# whisper-rs hanya ditarik saat feature `stt` aktif (butuh cmake + libclang).
whisper-rs = { version = "0.16", optional = true }

[features]
default = []
# Aktifkan setelah cmake + LLVM/libclang terpasang:  cargo build --release --features stt
stt = ["dep:whisper-rs"]

# Profil release dipindah ke workspace root (Cargo mengabaikan profil member).
# Override opt-level=3 untuk crate ini ada di root Cargo.toml
# ([profile.release.package.live2d-engine]).
